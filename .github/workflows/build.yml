name: Build Rates Widget APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log || {
            { grep -E "^e: " build.log; grep -vE "^> Task|^> Run with|^> Get more" build.log | grep -E "error:|What went wrong|Could not|^> |^  > "; } | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="RatesWidget-v$VER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" --target "$GITHUB_SHA" --title "v$VER" --notes "Version $VER, built from ${GITHUB_SHA::7}"
